<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1160" height="440" fill="#ffffff"/>

  <!-- Phase 1 -->
  <rect x="20" y="20" width="260" height="290" rx="18" fill="#e6ede7"/>
  <text x="42" y="56" font-size="17" fill="#66706b">Phase 1 · Weeks 1-2</text>
  <text x="42" y="94" font-size="26" font-weight="600" fill="#1f3a2b">Prototype and</text>
  <text x="42" y="124" font-size="26" font-weight="600" fill="#1f3a2b">staged checks</text>
  <text x="42" y="168" font-size="18" fill="#222624">Staged events (EM-01)</text>
  <text x="42" y="194" font-size="18" fill="#222624">Premises PR1-PR6</text>
  <text x="42" y="220" font-size="18" fill="#222624">No residents</text>
  <text x="42" y="262" font-size="18" font-style="italic" fill="#1f3a2b">Does each Function meet</text>
  <text x="42" y="286" font-size="18" font-style="italic" fill="#1f3a2b">its specification?</text>

  <polygon points="284,155 296,165 284,175" fill="#1f3a2b"/>

  <!-- Phase 2 -->
  <rect x="300" y="20" width="260" height="290" rx="18" fill="#f3ead4"/>
  <text x="322" y="56" font-size="17" fill="#66706b">Phase 2 · Weeks 3-4</text>
  <text x="322" y="94" font-size="26" font-weight="600" fill="#1f3a2b">Operator-voiced</text>
  <text x="322" y="124" font-size="26" font-weight="600" fill="#1f3a2b">pilot</text>
  <text x="322" y="168" font-size="18" fill="#222624">Build A (EM-01)</text>
  <text x="322" y="194" font-size="18" fill="#222624">4 resident pairs</text>
  <text x="322" y="220" font-size="18" fill="#222624">Observed walks (EM-02)</text>
  <text x="322" y="262" font-size="18" font-style="italic" fill="#1f3a2b">Do the wait and the</text>
  <text x="322" y="286" font-size="18" font-style="italic" fill="#1f3a2b">wording feel right?</text>

  <polygon points="564,155 576,165 564,175" fill="#1f3a2b"/>

  <!-- Phase 3 -->
  <rect x="580" y="20" width="330" height="290" rx="18" fill="#1f3a2b"/>
  <text x="602" y="56" font-size="17" fill="#cfe0d3">Phase 3 · Weeks 5-15</text>
  <text x="602" y="94" font-size="26" font-weight="600" fill="#ffffff">Summative</text>
  <text x="602" y="124" font-size="26" font-weight="600" fill="#ffffff">validation</text>
  <text x="602" y="168" font-size="18" fill="#ffffff">ABAB per pair (EM-03)</text>
  <text x="602" y="194" font-size="18" fill="#ffffff">6 pairs, 12 residents</text>
  <text x="602" y="220" font-size="18" fill="#ffffff">Claims CL1-CL9</text>
  <text x="602" y="262" font-size="18" font-style="italic" fill="#ffffff">Are the Claims confirmed?</text>

  <polygon points="914,155 926,165 914,175" fill="#1f3a2b"/>

  <!-- Phase 4 -->
  <rect x="930" y="20" width="210" height="290" rx="18" fill="#eceeeb"/>
  <text x="950" y="56" font-size="17" fill="#66706b">Phase 4 · Week 16</text>
  <text x="950" y="94" font-size="26" font-weight="600" fill="#1f3a2b">Stakeholder</text>
  <text x="950" y="124" font-size="26" font-weight="600" fill="#1f3a2b">evaluation</text>
  <text x="950" y="168" font-size="18" fill="#222624">Interviews (EM-04)</text>
  <text x="950" y="194" font-size="18" fill="#222624">Residents, relatives,</text>
  <text x="950" y="220" font-size="18" fill="#222624">care staff</text>
  <text x="950" y="262" font-size="18" font-style="italic" fill="#1f3a2b">Acceptable in daily</text>
  <text x="950" y="286" font-size="18" font-style="italic" fill="#1f3a2b">practice?</text>

  <!-- Ethics prerequisite -->
  <rect x="300" y="342" width="840" height="78" rx="14" fill="none" stroke="#c9962f" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="326" y="374" font-size="21" font-weight="600" fill="#8c6512">Prerequisite for phases 2-4: ethics approval</text>
  <text x="326" y="402" font-size="18" fill="#74602a">Supported consent with a representative; asked again at every walk; stop on distress.</text>
</svg>
