<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1160" height="490" fill="#ffffff"/>

  <!-- Week labels -->
  <g font-size="16" fill="#66706b">
    <text x="352" y="28">Wk 5</text>
    <text x="429" y="28">Weeks 6-7</text>
    <text x="573" y="28">Weeks 8-10</text>
    <text x="789" y="28">Weeks 11-12</text>
    <text x="933" y="28">Weeks 13-15</text>
  </g>

  <!-- Phases: F = familiarisation, A = baseline, B = intervention -->
  <rect x="350" y="40" width="67" height="84" rx="12" fill="#f3ead4"/>
  <rect x="419" y="40" width="142" height="84" rx="12" fill="#eceeeb"/>
  <rect x="563" y="40" width="214" height="84" rx="12" fill="#1f3a2b"/>
  <rect x="779" y="40" width="142" height="84" rx="12" fill="#eceeeb"/>
  <rect x="923" y="40" width="211" height="84" rx="12" fill="#1f3a2b"/>
  <g font-size="20" font-weight="600">
    <text x="383" y="90" fill="#8c6512" text-anchor="middle">F</text>
    <text x="431" y="74" fill="#1f3a2b">A · Baseline</text>
    <text x="431" y="104" font-size="16" font-weight="400" fill="#222624">walks as today</text>
    <text x="577" y="74" fill="#ffffff">B · Mindful Walk</text>
    <text x="577" y="104" font-size="16" font-weight="400" fill="#ffffff">full System</text>
    <text x="791" y="74" fill="#1f3a2b">A · Baseline</text>
    <text x="791" y="104" font-size="16" font-weight="400" fill="#222624">walks as today</text>
    <text x="937" y="74" fill="#ffffff">B · Mindful Walk</text>
    <text x="937" y="104" font-size="16" font-weight="400" fill="#ffffff">full System</text>
  </g>

  <!-- Lane labels -->
  <g font-size="19" fill="#222624">
    <text x="20" y="180">Every walk</text>
    <text x="20" y="202" font-size="15" fill="#66706b">walks, minutes, company (M-02)</text>
    <text x="20" y="252">Observed walks, 5+ per phase</text>
    <text x="20" y="274" font-size="15" fill="#66706b">slips, emotion, talk, safety (M-03 to M-06)</text>
    <text x="20" y="324">End of phase</text>
    <text x="20" y="346" font-size="15" fill="#66706b">loneliness (M-08)</text>
    <text x="20" y="396">Interviews</text>
    <text x="20" y="418" font-size="15" fill="#66706b">after A2 and B2 (EM-04)</text>
  </g>

  <!-- Lane guides -->
  <g stroke="#d5dcd6" stroke-width="1">
    <line x1="350" y1="190" x2="1134" y2="190"/>
    <line x1="350" y1="262" x2="1134" y2="262"/>
    <line x1="350" y1="334" x2="1134" y2="334"/>
    <line x1="350" y1="406" x2="1134" y2="406"/>
  </g>

  <!-- Every walk -->
  <rect x="419" y="184" width="715" height="12" rx="6" fill="#7b9472"/>

  <!-- Observed walks -->
  <g fill="#1f3a2b">
    <circle cx="442" cy="262" r="8"/><circle cx="466" cy="262" r="8"/><circle cx="490" cy="262" r="8"/><circle cx="514" cy="262" r="8"/><circle cx="538" cy="262" r="8"/>
    <circle cx="590" cy="262" r="8"/><circle cx="630" cy="262" r="8"/><circle cx="670" cy="262" r="8"/><circle cx="710" cy="262" r="8"/><circle cx="750" cy="262" r="8"/>
    <circle cx="802" cy="262" r="8"/><circle cx="826" cy="262" r="8"/><circle cx="850" cy="262" r="8"/><circle cx="874" cy="262" r="8"/><circle cx="898" cy="262" r="8"/>
    <circle cx="948" cy="262" r="8"/><circle cx="988" cy="262" r="8"/><circle cx="1028" cy="262" r="8"/><circle cx="1068" cy="262" r="8"/><circle cx="1108" cy="262" r="8"/>
  </g>

  <!-- End of phase -->
  <g fill="#c9962f">
    <polygon points="551,324 561,334 551,344 541,334"/>
    <polygon points="767,324 777,334 767,344 757,334"/>
    <polygon points="911,324 921,334 911,344 901,334"/>
    <polygon points="1124,324 1134,334 1124,344 1114,334"/>
  </g>

  <!-- Interviews -->
  <g fill="#8c6512">
    <rect x="903" y="398" width="16" height="16" rx="3"/>
    <rect x="1116" y="398" width="16" height="16" rx="3"/>
  </g>

  <text x="20" y="458" font-size="17" fill="#66706b">F: familiarisation week, device and listener present. Each case is its own control; phase changes fall on randomly drawn days.</text>
  <text x="20" y="482" font-size="17" fill="#66706b">Two tracks of four cases: resident pairs and resident-relative pairs. Safety alerts stay on in every phase.</text>
</svg>
