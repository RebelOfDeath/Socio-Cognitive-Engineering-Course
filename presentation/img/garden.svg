<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1160" height="470" fill="#ffffff"/>

  <!-- Care home -->
  <rect x="20" y="40" width="270" height="390" rx="14" fill="#eceeeb"/>
  <text x="44" y="80" font-size="24" font-weight="600" fill="#1f3a2b">Care home</text>

  <!-- Local server -->
  <rect x="44" y="110" width="30" height="12" rx="2" fill="none" stroke="#1f3a2b" stroke-width="3"/>
  <rect x="44" y="126" width="30" height="12" rx="2" fill="none" stroke="#1f3a2b" stroke-width="3"/>
  <rect x="44" y="142" width="30" height="12" rx="2" fill="none" stroke="#1f3a2b" stroke-width="3"/>
  <text x="88" y="126" font-size="20" font-weight="600" fill="#222624">Local server</text>
  <text x="88" y="148" font-size="16" fill="#66706b">a copy per resident</text>
  <text x="88" y="168" font-size="16" fill="#66706b">no internet</text>

  <!-- Pepper at the door -->
  <circle cx="238" cy="235" r="24" fill="#ffffff" stroke="#1f3a2b" stroke-width="3"/>
  <circle cx="230" cy="231" r="3.5" fill="#1f3a2b"/>
  <circle cx="246" cy="231" r="3.5" fill="#1f3a2b"/>
  <text x="44" y="228" font-size="20" font-weight="600" fill="#222624">Pepper</text>
  <text x="44" y="252" font-size="16" fill="#66706b">asks, introduces,</text>
  <text x="44" y="272" font-size="16" fill="#66706b">welcomes back</text>

  <!-- Care worker phone -->
  <rect x="44" y="330" width="26" height="44" rx="5" fill="none" stroke="#1f3a2b" stroke-width="3"/>
  <circle cx="57" cy="366" r="2.5" fill="#1f3a2b"/>
  <text x="86" y="348" font-size="20" font-weight="600" fill="#222624">Care worker</text>
  <text x="86" y="372" font-size="16" fill="#66706b">alerts,</text>
  <text x="86" y="392" font-size="16" fill="#66706b">painful questions</text>

  <!-- Garden -->
  <rect x="310" y="20" width="830" height="430" rx="24" fill="#edf3ec" stroke="#b9c6bb" stroke-width="3"/>
  <rect x="282" y="205" width="36" height="60" fill="#1f3a2b"/>
  <!-- Gate: gap in the fence -->
  <rect x="1132" y="200" width="16" height="64" fill="#ffffff"/>
  <line x1="1140" y1="200" x2="1140" y2="264" stroke="#8c6512" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="1124" y="190" font-size="18" font-weight="600" fill="#8c6512" text-anchor="end">Gate</text>

  <!-- Path loop -->
  <line x1="318" y1="235" x2="400" y2="235" stroke="#d6ccb6" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="700" cy="235" rx="300" ry="150" fill="none" stroke="#d6ccb6" stroke-width="16"/>

  <!-- Landmarks -->
  <ellipse cx="600" cy="195" rx="58" ry="30" fill="#a9c4cf"/>
  <text x="600" y="201" font-size="18" fill="#222624" text-anchor="middle">Pond</text>
  <g fill="#d08c96">
    <circle cx="812" cy="186" r="13"/><circle cx="836" cy="180" r="13"/><circle cx="860" cy="190" r="13"/>
    <circle cx="824" cy="206" r="13"/><circle cx="850" cy="210" r="13"/>
  </g>
  <text x="836" y="245" font-size="18" fill="#222624" text-anchor="middle">Roses</text>
  <rect x="670" y="320" width="64" height="14" rx="3" fill="#6b5a46"/>
  <text x="702" y="356" font-size="18" fill="#222624" text-anchor="middle">Bench</text>

  <!-- Beacons -->
  <g>
    <circle cx="668" cy="178" r="16" fill="none" stroke="#c9962f" stroke-width="2" opacity=".6"/>
    <circle cx="668" cy="178" r="7" fill="#c9962f"/>
    <circle cx="890" cy="160" r="16" fill="none" stroke="#c9962f" stroke-width="2" opacity=".6"/>
    <circle cx="890" cy="160" r="7" fill="#c9962f"/>
    <circle cx="760" cy="318" r="16" fill="none" stroke="#c9962f" stroke-width="2" opacity=".6"/>
    <circle cx="760" cy="318" r="7" fill="#c9962f"/>
    <circle cx="1100" cy="232" r="16" fill="none" stroke="#c9962f" stroke-width="2" opacity=".6"/>
    <circle cx="1100" cy="232" r="7" fill="#c9962f"/>
  </g>

  <!-- Walkers on the path, a pocket guide each -->
  <circle cx="438" cy="152" r="11" fill="#1f3a2b"/>
  <circle cx="462" cy="144" r="11" fill="#1f3a2b"/>
  <rect x="425" y="160" width="12" height="16" rx="3" fill="#c9962f"/>
  <rect x="470" y="152" width="12" height="16" rx="3" fill="#c9962f"/>
  <text x="340" y="62" font-size="20" font-weight="600" fill="#222624">Jan and Elena</text>
  <text x="340" y="86" font-size="16" fill="#66706b">a pocket guide each</text>

  <!-- Legend -->
  <circle cx="348" cy="420" r="7" fill="#c9962f"/>
  <text x="364" y="426" font-size="17" fill="#66706b">Beacon: a place to talk about, or a gate alert · no GPS · nothing leaves the home</text>
</svg>
