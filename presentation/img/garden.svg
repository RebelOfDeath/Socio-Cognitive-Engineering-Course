<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1160" height="470" fill="#fbfaf7"/>

  <!-- Care home -->
  <rect x="20" y="40" width="270" height="390" rx="14" fill="#e6e3dc"/>
  <text x="44" y="80" font-size="24" font-weight="600" fill="#2f5d50">Care home</text>

  <!-- Pepper at the door -->
  <circle cx="238" cy="235" r="24" fill="#ffffff" stroke="#2f5d50" stroke-width="3"/>
  <circle cx="230" cy="231" r="3.5" fill="#2f5d50"/>
  <circle cx="246" cy="231" r="3.5" fill="#2f5d50"/>
  <text x="44" y="228" font-size="20" font-weight="600" fill="#1f2a2e">Pepper</text>
  <text x="44" y="252" font-size="16" fill="#5b6b66">invites, welcomes back</text>

  <!-- Care worker phone -->
  <rect x="44" y="330" width="26" height="44" rx="5" fill="none" stroke="#2f5d50" stroke-width="3"/>
  <circle cx="57" cy="366" r="2.5" fill="#2f5d50"/>
  <text x="86" y="348" font-size="20" font-weight="600" fill="#1f2a2e">Care worker</text>
  <text x="86" y="372" font-size="16" fill="#5b6b66">phone: alerts only</text>

  <!-- Garden -->
  <rect x="310" y="20" width="830" height="430" rx="24" fill="#eef3ef" stroke="#b9c8c0" stroke-width="3"/>
  <rect x="282" y="205" width="36" height="60" fill="#2f5d50"/>
  <!-- Gate: gap in the fence -->
  <rect x="1132" y="200" width="16" height="64" fill="#fbfaf7"/>
  <line x1="1140" y1="200" x2="1140" y2="264" stroke="#9a5f1e" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="1124" y="190" font-size="18" font-weight="600" fill="#9a5f1e" text-anchor="end">Gate</text>

  <!-- Path loop -->
  <line x1="318" y1="235" x2="400" y2="235" stroke="#d6c7a6" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="700" cy="235" rx="300" ry="150" fill="none" stroke="#d6c7a6" stroke-width="16"/>

  <!-- Landmarks -->
  <ellipse cx="600" cy="195" rx="58" ry="30" fill="#a9cbd9"/>
  <text x="600" y="201" font-size="18" fill="#1f2a2e" text-anchor="middle">Pond</text>
  <g fill="#e39aa8">
    <circle cx="812" cy="186" r="13"/><circle cx="836" cy="180" r="13"/><circle cx="860" cy="190" r="13"/>
    <circle cx="824" cy="206" r="13"/><circle cx="850" cy="210" r="13"/>
  </g>
  <text x="836" y="245" font-size="18" fill="#1f2a2e" text-anchor="middle">Roses</text>
  <rect x="670" y="320" width="64" height="14" rx="3" fill="#8a6a4a"/>
  <text x="702" y="356" font-size="18" fill="#1f2a2e" text-anchor="middle">Bench</text>

  <!-- Beacons -->
  <g>
    <circle cx="668" cy="178" r="16" fill="none" stroke="#c9873a" stroke-width="2" opacity=".6"/>
    <circle cx="668" cy="178" r="7" fill="#c9873a"/>
    <circle cx="890" cy="160" r="16" fill="none" stroke="#c9873a" stroke-width="2" opacity=".6"/>
    <circle cx="890" cy="160" r="7" fill="#c9873a"/>
    <circle cx="760" cy="318" r="16" fill="none" stroke="#c9873a" stroke-width="2" opacity=".6"/>
    <circle cx="760" cy="318" r="7" fill="#c9873a"/>
    <circle cx="1100" cy="232" r="16" fill="none" stroke="#c9873a" stroke-width="2" opacity=".6"/>
    <circle cx="1100" cy="232" r="7" fill="#c9873a"/>
  </g>

  <!-- Walkers on the path -->
  <circle cx="438" cy="152" r="11" fill="#2f5d50"/>
  <circle cx="462" cy="144" r="11" fill="#2f5d50"/>
  <rect x="425" y="160" width="12" height="16" rx="3" fill="#c9873a"/>
  <text x="340" y="62" font-size="20" font-weight="600" fill="#1f2a2e">Jan and Kees</text>
  <text x="340" y="86" font-size="16" fill="#5b6b66">pocket guide on the rollator</text>

  <!-- Legend -->
  <circle cx="348" cy="420" r="7" fill="#c9873a"/>
  <text x="364" y="426" font-size="17" fill="#5b6b66">Beacon: place cue or gate alert · no GPS · no route stored · microphone off</text>
</svg>
